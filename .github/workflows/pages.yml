# Publishes the web/ folder to GitHub Pages on every push to main.
name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the bundled libraries are unmodified
        run: cd web/vendor && sha256sum --check --quiet SHA256SUMS

      - name: Stamp the build id (makes installed copies pick up the update)
        run: sed -i "s/__BUILD__/${GITHUB_SHA::12}/" web/sw.js

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v5
